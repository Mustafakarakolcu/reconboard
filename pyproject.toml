[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconboard"
version = "0.1.2"
description = "Scope-guarded recon pipeline (subfinder + crt.sh + httpx + optional nmap) for authorized bug bounty work"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "rich>=13",
    "tldextract>=5",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reconboard = "reconboard.cli:app"

[tool.setuptools.packages.find]
include = ["reconboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
